<!DOCTYPE html>
<html>
<head>
    <title>LOOKET ME - Verify OTP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0d1712; 
        }
        .login-wrapper {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            background-image: url("{{ url_for('static', filename='logo.png') }}");
            background-size: contain;       
            background-position: calc(50% + 100px) center;  
            background-repeat: no-repeat; 
            background-color: #0d1712; 
        }
        .login-box {
            background: rgba(13, 23, 18, 0.55); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            width: 100%;
            max-width: 460px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6);
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .login-box h2 {
            text-align: center;
            color: #f97316; 
            margin-bottom: 20px;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }
        .otp-instructions {
            color: #9ca3af;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .flash-alert {
            background: rgba(127, 29, 29, 0.6);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #b91c1c;
        }
        .input-wrapper {
            margin-bottom: 25px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 16px 18px;
            background: #1b3327; 
            border: 1px solid #2d4f3e;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-wrapper input:focus {
            border-color: #f97316;
            background: #14241c; 
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }
        .submit-btn {
            width: 100%;
            background: #f97316;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }
        .submit-btn:hover {
            background: #ea580c;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            
            <div class="logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Looket Me Logo" style="width: 130px; height: auto; border-radius: 50%;">
            </div>

            <h2>VERIFY SECURITY OTP</h2>
            <p class="otp-instructions">Enter the 6-digit verification code sent to your phone number to authorize system registration.</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash-alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/verify_otp" method="POST" style="background: none; padding: 0; box-shadow: none; max-width: 100%;">
                <div class="input-wrapper">
                    <input type="text" name="otp_attempt" maxlength="6" placeholder="000000" required autocomplete="off">
                </div>
                <button type="submit" class="submit-btn">Verify & Secure Account</button>
            </form>

        </div>
    </div>

</body>
</html>
